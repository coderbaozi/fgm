name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

  build_and_upload:
    needs: create_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux only)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          bin="fgm"
          outdir="dist"

          # 产物命名对齐 scripts/install.sh 的 target 识别规则：<arch>-<os>
          # - arch: x86_64 / aarch64
          # - os: apple-darwin / linux
          arch_key="${target%%-*}"
          if [[ "${target}" == *"apple-darwin"* ]]; then
            os_key="apple-darwin"
          elif [[ "${target}" == *"linux"* ]]; then
            os_key="linux"
          else
            echo "unsupported target for packaging: ${target}" 1>&2
            exit 1
          fi

          mkdir -p "${outdir}"
          tmp="$(mktemp -d)"
          cp "target/${target}/release/${bin}" "${tmp}/${bin}"
          chmod +x "${tmp}/${bin}"

          archive="${bin}-${version}-${arch_key}-${os_key}.tar.gz"
          tar -C "${tmp}" -czf "${outdir}/${archive}" "${bin}"
          rm -rf "${tmp}"

          file="${outdir}/${archive}"
          sha="$(shasum -a 256 "${file}" | awk '{print $1}')"
          printf "%s  %s\n" "${sha}" "${archive}" > "${file}.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*
